name: Bug report
description: Report a reproducible runtime, test, or documentation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Include the course version, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide deterministic steps without secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
